name: Test annotations with dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: docker buildx create --use

      - id: action
        uses: .
        with:
          push: 'false'
          index-annotations: |
            org.opencontainers.image.title=test-image
            org.opencontainers.image.description=A test image
          sources: |
            alpine:3.18.0@sha256:c0669ef34cdc14332c0f1ab0c2c01acb91d96014b172f1a76f3a39e63d1f0bda
            alpine:3.18.0@sha256:af06af3514c44a964d3b905b498cf6493db8f1cde7c10e078213a89c87308ba0

      - name: Assert digest is empty (dry-run does not set digest)
        env:
          DIGEST: ${{ steps.action.outputs.digest }}
        run: |
          echo "digest: '$DIGEST'"
          if [ -n "$DIGEST" ]; then
            echo "FAIL: expected empty digest for dry-run but got '$DIGEST'"
            exit 1
          fi
          echo "PASS: dry-run with annotations completed successfully"
