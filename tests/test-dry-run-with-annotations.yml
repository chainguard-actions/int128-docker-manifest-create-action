name: Test dry-run with index annotations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          push: 'false'
          index-annotations: |
            org.opencontainers.image.title=my-test-image
            org.opencontainers.image.description=A test image
          sources: |
            alpine:3.18
      - name: Assert digest is empty (dry-run does not set digest)
        env:
          DIGEST: ${{ steps.action.outputs.digest }}
        run: |
          echo "digest: '$DIGEST'"
          if [ -n "$DIGEST" ]; then
            echo "FAIL: expected digest to be empty for dry-run, got: $DIGEST"
            exit 1
          fi
          echo "PASS: action completed successfully with annotations in dry-run mode"
