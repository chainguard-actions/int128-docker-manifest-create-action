name: Test dry-run with index annotations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: docker buildx create --use

      - id: action
        name: Run action in dry-run mode with annotations
        uses: .
        with:
          push: 'false'
          index-annotations: |
            org.opencontainers.image.title=My Test Image
            org.opencontainers.image.description=A test image for CI
          sources: |
            alpine:3.18

      - name: Assert no digest output (dry-run does not produce digest)
        env:
          DIGEST: ${{ steps.action.outputs.digest }}
        run: |
          echo "digest: '$DIGEST'"
          if [ -n "$DIGEST" ]; then
            echo "FAIL: expected empty digest in dry-run mode with annotations, got: $DIGEST"
            exit 1
          fi
          echo "PASS: digest is empty as expected for dry-run with annotations"
