name: Test with index annotations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          push: 'false'
          sources: |
            alpine:3.18
          index-annotations: |
            org.opencontainers.image.title=Test Image
            org.opencontainers.image.description=A test multi-arch image
            org.opencontainers.image.version=1.0.0
      - name: Assert action completed with annotations
        run: |
          echo "Action completed successfully with annotations and without push"
          echo "PASS"
