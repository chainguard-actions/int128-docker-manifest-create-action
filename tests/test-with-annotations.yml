name: Test with index annotations (push disabled)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Docker Buildx
        run: docker buildx create --use
      - id: action
        uses: .
        with:
          push: 'false'
          sources: |
            alpine:3.18
          tags: |
            example.com/test/myimage:annotated
          index-annotations: |
            org.opencontainers.image.title=Test Image
            org.opencontainers.image.description=A test multi-arch image
      - name: Assert action completed (digest is empty when push=false)
        env:
          DIGEST: ${{ steps.action.outputs.digest }}
        run: |
          echo "digest: '$DIGEST'"
          if [ -n "$DIGEST" ]; then
            echo "FAIL: expected digest to be empty when push=false"
            exit 1
          fi
          echo "PASS: action completed with annotations in dry-run mode"
