name: Test with index annotations (no push)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          push: 'false'
          tags: |
            example.com/test/annotated-image:v1.0.0
          sources: |
            alpine:3.18
          index-annotations: |
            org.opencontainers.image.title=My Test Image
            org.opencontainers.image.description=A test image with annotations
            org.opencontainers.image.version=1.0.0

      - name: Assert action completed successfully
        run: |
          echo "PASS: action with annotations completed without error"
