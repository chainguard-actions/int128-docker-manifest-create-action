name: Test dry-run mode (push false)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: docker buildx create --use --name test-builder

      - id: action
        name: Run action in dry-run mode
        uses: .
        with:
          push: 'false'
          sources: |
            alpine:3.18

      - name: Assert no digest output in dry-run mode
        env:
          DIGEST: ${{ steps.action.outputs.digest }}
        run: |
          echo "digest: '$DIGEST'"
          if [ -n "$DIGEST" ]; then
            echo "FAIL: expected no digest in dry-run mode, got: $DIGEST"
            exit 1
          fi
          echo "PASS: no digest output as expected in dry-run mode"
