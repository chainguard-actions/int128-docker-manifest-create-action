name: Test dry-run mode (push=false)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: docker buildx create --use --name test-builder

      - id: action
        name: Run action in dry-run mode
        uses: .
        with:
          push: 'false'
          sources: |
            alpine:3.18.0@sha256:c0d488a800e4127c334ad20d61d7bc21b4097540327217dfab52262adc02380c
            alpine:3.18.0@sha256:25fad2a32ad1f6f510e528448ae1ec69a28ef81916a004d3629874104f8a7f70

      - name: Assert no digest output (dry-run does not produce digest)
        env:
          DIGEST: ${{ steps.action.outputs.digest }}
        run: |
          echo "digest: '$DIGEST'"
          if [ -n "$DIGEST" ]; then
            echo "FAIL: expected empty digest in dry-run mode, got: $DIGEST"
            exit 1
          fi
          echo "PASS: digest is empty as expected for dry-run"
