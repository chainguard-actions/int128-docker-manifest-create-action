name: Test dry run with index annotations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure docker buildx is available
        run: |
          if docker buildx version >/dev/null 2>&1; then
            docker buildx version
            exit 0
          fi
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -sSfL -o "$HOME/.docker/cli-plugins/docker-buildx" \
            https://github.com/docker/buildx/releases/download/v0.17.1/buildx-v0.17.1.linux-amd64
          chmod +x "$HOME/.docker/cli-plugins/docker-buildx"
          docker buildx version
      - id: action
        uses: .
        with:
          push: "false"
          index-annotations: |
            org.opencontainers.image.description=act test image
            org.opencontainers.image.source=https://example.com/test
          sources: |
            docker.io/library/hello-world:latest
      - name: Assert success and no digest output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DIGEST: ${{ steps.action.outputs.digest }}
        run: |
          echo "outcome: $OUTCOME"
          echo "digest: '$DIGEST'"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -n "$DIGEST" ]; then
            echo "FAIL: digest should be empty in dry-run mode"
            exit 1
          fi
          echo "PASS"
