name: Test dry run with index annotations and multiple sources
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          push: 'false'
          index-annotations: |
            org.opencontainers.image.description=test image
            org.opencontainers.image.source=https://example.com/repo
          sources: |
            docker.io/library/busybox:1.36
            docker.io/library/alpine:3.20
      - name: Assert dry run succeeded with no digest
        env:
          ACTUAL: ${{ steps.action.outputs.digest }}
        run: |
          echo "digest: $ACTUAL"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected empty digest for dry run"
            exit 1
          fi
          echo "PASS"
