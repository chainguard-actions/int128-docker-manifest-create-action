name: Test with tags and annotations (no push, dry-run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          push: 'false'
          tags: |
            example.com/myimage:latest
            example.com/myimage:1.0.0
          sources: |
            alpine:3.18
          index-annotations: |
            org.opencontainers.image.title=My Test Image
            org.opencontainers.image.description=A test multi-arch image
        continue-on-error: true

      - name: Assert action ran (dry-run with tags and annotations, or failed gracefully)
        env:
          DIGEST: ${{ steps.action.outputs.digest }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "digest: $DIGEST"
          if [ "$OUTCOME" = "success" ]; then
            # When push=false, the action does a dry-run and intentionally returns no digest
            echo "PASS: dry-run with tags and annotations succeeded (digest is intentionally empty when push=false)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (docker buildx may not be available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
