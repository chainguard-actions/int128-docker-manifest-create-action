name: Test basic no-push manifest creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pull source images for manifest creation
        run: |
          docker pull --platform linux/amd64 alpine:3.18
          docker pull --platform linux/arm64 alpine:3.18

      - id: action
        uses: .
        continue-on-error: true
        with:
          push: 'false'
          sources: |
            alpine:3.18

      - name: Assert action ran and produced output or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DIGEST: ${{ steps.action.outputs.digest }}
        run: |
          echo "outcome: $OUTCOME"
          echo "digest: $DIGEST"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without registry push)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
