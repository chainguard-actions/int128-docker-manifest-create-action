name: Test push=true requires tags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: docker buildx create --use --name test-builder-tags

      - id: action
        name: Run action with push=true but no tags (should fail)
        uses: .
        continue-on-error: true
        with:
          push: 'true'
          sources: |
            alpine:3.18.0@sha256:c0d488a800e4127c334ad20d61d7bc21b4097540327217dfab52262adc02380c

      - name: Assert action failed due to missing tags
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when push=true and no tags provided, got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when tags were not provided"
