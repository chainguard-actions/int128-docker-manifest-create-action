name: Test push mode requires tags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run action with push=true but no tags (should fail)
        uses: .
        with:
          push: 'true'
          sources: |
            alpine:3.18
        continue-on-error: true

      - name: Assert action failed when tags are missing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: '$OUTCOME'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when push=true and no tags provided, got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when tags were not provided"
