name: Test tags input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: docker buildx create --use --name test-builder

      - id: action
        name: Run action with explicit tags input
        uses: .
        with:
          push: 'false'
          tags: |
            example.com/myimage:latest
            example.com/myimage:1.0.0
          sources: |
            alpine:3.18

      - name: Assert action completed with tags input
        env:
          DIGEST: ${{ steps.action.outputs.digest }}
        run: |
          echo "digest: '$DIGEST'"
          echo "Action completed successfully with tags input"
          echo "PASS"
