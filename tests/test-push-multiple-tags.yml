name: Test push manifest to multiple tags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure docker buildx is available
        run: |
          if docker buildx version >/dev/null 2>&1; then
            docker buildx version
            exit 0
          fi
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -sSfL -o "$HOME/.docker/cli-plugins/docker-buildx" \
            https://github.com/docker/buildx/releases/download/v0.17.1/buildx-v0.17.1.linux-amd64
          chmod +x "$HOME/.docker/cli-plugins/docker-buildx"
          docker buildx version
      - id: repo
        name: Generate unique ephemeral repository on ttl.sh
        run: |
          NAME="ttl.sh/actionchain-dmca-$(date +%s)-$RANDOM$RANDOM"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "repo: $NAME"
      - id: action
        uses: .
        with:
          push: "true"
          index-annotations: |
            org.opencontainers.image.description=act test image
          tags: |
            ${{ steps.repo.outputs.name }}:1h
            ${{ steps.repo.outputs.name }}:2h
          sources: |
            docker.io/library/hello-world:latest
      - name: Assert digest output
        env:
          DIGEST: ${{ steps.action.outputs.digest }}
          REPO: ${{ steps.repo.outputs.name }}
        run: |
          echo "digest: $DIGEST"
          if ! echo "$DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "FAIL: digest is not a sha256 digest"
            exit 1
          fi
          SECOND=$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$REPO:2h" | tr -d '"')
          echo "second tag digest: $SECOND"
          if [ "$SECOND" != "$DIGEST" ]; then
            echo "FAIL: second tag digest does not match output digest"
            exit 1
          fi
          echo "PASS"
