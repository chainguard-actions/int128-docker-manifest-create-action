name: Test error when push is true but tags is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify Docker Buildx is available
        run: |
          docker buildx version
          docker buildx ls
      - id: action
        uses: .
        with:
          push: 'true'
          # tags is intentionally omitted to trigger the assertion error
          sources: |
            alpine:3.18
            alpine:3.17
        continue-on-error: true
      - name: Assert action failed due to missing tags
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when push=true but tags is not set"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when push=true and tags is missing"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
