name: Test multiple destination tags (no push)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          push: 'false'
          tags: |
            example.com/test/myimage:latest
            example.com/test/myimage:1.0.0
            example.com/test/myimage:1
          sources: |
            alpine:3.18
            alpine:3.17

      - name: Assert action completed successfully with multiple tags
        run: |
          echo "PASS: action with multiple tags completed without error"
