name: Test sources only (no tags, push disabled)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Docker Buildx
        run: docker buildx create --use
      - id: action
        uses: .
        with:
          push: 'false'
          sources: |
            alpine:3.18
      - name: Assert step completed without error
        env:
          DIGEST: ${{ steps.action.outputs.digest }}
        run: |
          echo "digest: '$DIGEST'"
          echo "Action completed successfully with sources only (no tags)"
          echo "PASS"
