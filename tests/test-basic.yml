name: Test basic usage (no push)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          push: 'false'
          tags: |
            ghcr.io/example/myimage:latest
          sources: |
            ghcr.io/example/myimage:amd64
            ghcr.io/example/myimage:arm64
      - name: Assert digest output exists or is empty (no push)
        env:
          DIGEST: ${{ steps.action.outputs.digest }}
        run: |
          echo "digest: $DIGEST"
          echo "PASS: action completed without error"
