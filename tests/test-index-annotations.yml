name: Test index-annotations input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          push: 'false'
          tags: |
            ghcr.io/example/myimage:annotated
          sources: |
            ghcr.io/example/myimage:amd64
            ghcr.io/example/myimage:arm64
          index-annotations: |
            org.opencontainers.image.description=Test image
            org.opencontainers.image.vendor=ExampleOrg
      - name: Assert action completed successfully
        run: |
          echo "PASS: action with index-annotations completed without error"
