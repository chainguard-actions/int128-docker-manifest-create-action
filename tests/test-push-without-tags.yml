name: Test push without tags fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          push: 'true'
          sources: |
            docker.io/library/busybox:1.36
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.digest }}
        run: |
          echo "outcome: $OUTCOME"
          echo "digest: $ACTUAL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when tags are missing and push is true"
            exit 1
          fi
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected no digest output"
            exit 1
          fi
          echo "PASS"
