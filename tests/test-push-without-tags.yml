name: Test push without tags fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure docker buildx is available
        run: |
          if docker buildx version >/dev/null 2>&1; then
            docker buildx version
            exit 0
          fi
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -sSfL -o "$HOME/.docker/cli-plugins/docker-buildx" \
            https://github.com/docker/buildx/releases/download/v0.17.1/buildx-v0.17.1.linux-amd64
          chmod +x "$HOME/.docker/cli-plugins/docker-buildx"
          docker buildx version
      - id: action
        uses: .
        continue-on-error: true
        with:
          push: "true"
          sources: |
            docker.io/library/hello-world:latest
      - name: Assert action failed (tags must be set)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DIGEST: ${{ steps.action.outputs.digest }}
        run: |
          echo "outcome: $OUTCOME"
          echo "digest: '$DIGEST'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when push=true and no tags"
            exit 1
          fi
          if [ -n "$DIGEST" ]; then
            echo "FAIL: digest should not be set"
            exit 1
          fi
          echo "PASS"
