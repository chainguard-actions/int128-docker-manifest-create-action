name: Test manifest creation with explicit tags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          push: 'false'
          tags: |
            ghcr.io/example/myapp:latest
            ghcr.io/example/myapp:1.0.0
          sources: |
            alpine:3.18

      - name: Assert action ran with tags input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DIGEST: ${{ steps.action.outputs.digest }}
        run: |
          echo "outcome: $OUTCOME"
          echo "digest: $DIGEST"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with tags"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without registry access)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
