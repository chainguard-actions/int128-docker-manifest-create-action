name: Test with tags input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          push: 'false'
          tags: |
            ghcr.io/example/myimage:latest
            ghcr.io/example/myimage:v1.0.0
          sources: |
            ghcr.io/example/myimage:amd64
            ghcr.io/example/myimage:arm64
      - name: Assert action completed
        run: |
          echo "Action completed successfully with tags input"
          echo "PASS"
